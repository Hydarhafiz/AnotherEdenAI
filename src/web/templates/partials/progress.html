<!-- partials/progress.html — returned by POST /api/query -->
<!-- HTMX opens SSE GET connection to /api/stream/{job_id} automatically. -->
<!-- sse-close="done" tells the SSE extension to close when "done" event fires. -->
<div id="progress-container"
     hx-ext="sse"
     sse-connect="/api/stream/{{ job_id }}"
     sse-close="done">

  <div id="pipeline-steps" aria-live="polite">
    <div class="pipeline-step" id="step-plan"     data-node="PLAN">
      <span class="step-icon">⬜</span>
      <span class="step-label">Planning strategy</span>
    </div>
    <div class="pipeline-step" id="step-cypher"   data-node="CYPHER">
      <span class="step-icon">⬜</span>
      <span class="step-label">Building database query</span>
    </div>
    <div class="pipeline-step" id="step-validate" data-node="VALIDATE">
      <span class="step-icon">⬜</span>
      <span class="step-label">Validating results</span>
    </div>
    <div class="pipeline-step" id="step-candidates" data-node="CANDIDATES">
      <span class="step-icon">⬜</span>
      <span class="step-label">Preparing legal candidates</span>
    </div>
    <div class="pipeline-step" id="step-analyze"  data-node="ANALYZE">
      <span class="step-icon">⬜</span>
      <span class="step-label">Analyzing team composition</span>
    </div>
    <div class="pipeline-step" id="step-format"   data-node="FORMAT">
      <span class="step-icon">⬜</span>
      <span class="step-label">Formatting recommendations</span>
    </div>
  </div>

  <!-- Hidden swap target — prevents HTMX from dumping raw JSON anywhere visible -->
  <div id="progress-status" sse-swap="node_status" style="display:none"></div>

  <!-- sse-swap="result" replaces result-area when final result event arrives. -->
  <div id="result-area"
       sse-swap="result"
       hx-swap="outerHTML"
       hx-target="#result-container">
  </div>
</div>

<style>
  #pipeline-steps {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 1rem 0;
  }
  .pipeline-step {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.4rem 0.6rem;
    border-radius: 0.4rem;
    font-size: 0.95rem;
    transition: background 0.2s, color 0.2s;
    color: var(--pico-muted-color);
  }
  .pipeline-step.active {
    background: var(--pico-card-background-color);
    color: var(--pico-color);
    font-weight: 600;
  }
  .pipeline-step.done {
    color: var(--pico-color);
  }
  .pipeline-step.error-step {
    color: var(--pico-del-color, #c0392b);
  }
  .step-icon {
    font-size: 1rem;
    width: 1.2rem;
    text-align: center;
  }
  .step-retry {
    font-size: 0.8rem;
    color: var(--pico-muted-color);
    margin-left: auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--pico-muted-border-color);
    border-top-color: var(--pico-primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
</style>

<!-- SSE step tracking handled by app.js (registered once on document) -->
