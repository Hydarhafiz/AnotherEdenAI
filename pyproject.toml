[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "anotheredenai"
version = "0.1.0"
description = "Mathematically optimal team recommendations for Another Eden constrained to the player's actual roster"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "nodriver>=0.48.1",
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
    "neo4j>=5.0",
    "langchain-neo4j>=0.8",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
